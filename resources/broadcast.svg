<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- Center circle -->
  <circle cx="10" cy="10" r="1.5"/>
  <!-- Left inner crescent (R_out=4.5, R_in=3, ±60°) -->
  <path d="M 12.25,13.9 A 4.5,4.5 0 1,1 12.25,6.1 L 11.5,7.4 A 3,3 0 1,0 11.5,12.6 Z"/>
  <!-- Left outer crescent (R_out=7.5, R_in=6, ±60°) -->
  <path d="M 13.75,16.5 A 7.5,7.5 0 1,1 13.75,3.5 L 13,4.8 A 6,6 0 1,0 13,15.2 Z"/>
  <!-- Right inner crescent (mirror) -->
  <path d="M 7.75,13.9 A 4.5,4.5 0 1,0 7.75,6.1 L 8.5,7.4 A 3,3 0 1,1 8.5,12.6 Z"/>
  <!-- Right outer crescent (mirror) -->
  <path d="M 6.25,16.5 A 7.5,7.5 0 1,0 6.25,3.5 L 7,4.8 A 6,6 0 1,1 7,15.2 Z"/>
</svg>
