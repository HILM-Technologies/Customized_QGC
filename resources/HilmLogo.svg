<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

  <!-- Hexagonal frame -->
  <polygon
    points="50,4 93,27.5 93,72.5 50,96 7,72.5 7,27.5"
    fill="none"
    stroke="#00C8C8"
    stroke-width="4.5"
    stroke-linejoin="round"/>

  <!-- Bold H letterform -->
  <!-- Left vertical bar -->
  <rect x="20" y="24" width="16" height="52" rx="4" fill="#00C8C8"/>
  <!-- Right vertical bar -->
  <rect x="64" y="24" width="16" height="52" rx="4" fill="#00C8C8"/>
  <!-- Horizontal crossbar -->
  <rect x="20" y="42" width="60" height="16" rx="4" fill="#00C8C8"/>

</svg>
