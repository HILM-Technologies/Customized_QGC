<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
    <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ff4444" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ff6666"/>
            <stop offset="100%" stop-color="#cc0000"/>
        </radialGradient>
    </defs>

    <!-- Outer glow -->
    <circle cx="36" cy="36" r="34" fill="url(#glow)"/>

    <!-- Outer ring -->
    <circle cx="36" cy="36" r="26" fill="none" stroke="#FF5252" stroke-width="2" stroke-opacity="0.7"/>

    <!-- Inner ring -->
    <circle cx="36" cy="36" r="14" fill="none" stroke="#FF5252" stroke-width="1.5" stroke-opacity="0.9"/>

    <!-- Crosshair lines -->
    <line x1="36" y1="2"  x2="36" y2="20" stroke="#FF5252" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="36" y1="52" x2="36" y2="70" stroke="#FF5252" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="2"  y1="36" x2="20" y2="36" stroke="#FF5252" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="52" y1="36" x2="70" y2="36" stroke="#FF5252" stroke-width="2" stroke-opacity="0.8"/>

    <!-- Center dot -->
    <circle cx="36" cy="36" r="4" fill="url(#dotGlow)" stroke="#ff0000" stroke-width="1"/>
</svg>
