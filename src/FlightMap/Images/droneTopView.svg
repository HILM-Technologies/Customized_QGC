<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <!-- ── Arms (front pair brighter, rear pair slightly dimmer) ── -->
  <!-- Front-left -->
  <line x1="32" y1="32" x2="12" y2="12" stroke="white" stroke-width="2.6" stroke-linecap="round" opacity="0.95"/>
  <!-- Front-right -->
  <line x1="32" y1="32" x2="52" y2="12" stroke="white" stroke-width="2.6" stroke-linecap="round" opacity="0.95"/>
  <!-- Rear-left -->
  <line x1="32" y1="32" x2="12" y2="52" stroke="white" stroke-width="2.0" stroke-linecap="round" opacity="0.65"/>
  <!-- Rear-right -->
  <line x1="32" y1="32" x2="52" y2="52" stroke="white" stroke-width="2.0" stroke-linecap="round" opacity="0.65"/>

  <!-- ── Propeller rings ── -->
  <!-- Front two (brighter) -->
  <circle cx="12" cy="12" r="8.5" fill="rgba(0,200,200,0.12)" stroke="white" stroke-width="1.8" opacity="0.92"/>
  <circle cx="52" cy="12" r="8.5" fill="rgba(0,200,200,0.12)" stroke="white" stroke-width="1.8" opacity="0.92"/>
  <!-- Rear two (dimmer) -->
  <circle cx="12" cy="52" r="8.5" fill="rgba(0,200,200,0.07)" stroke="white" stroke-width="1.4" opacity="0.55"/>
  <circle cx="52" cy="52" r="8.5" fill="rgba(0,200,200,0.07)" stroke="white" stroke-width="1.4" opacity="0.55"/>

  <!-- ── Propeller blades (cross lines) — front ── -->
  <line x1="7"  y1="12" x2="17" y2="12" stroke="white" stroke-width="1.3" opacity="0.75" stroke-linecap="round"/>
  <line x1="12" y1="7"  x2="12" y2="17" stroke="white" stroke-width="1.3" opacity="0.75" stroke-linecap="round"/>
  <line x1="47" y1="12" x2="57" y2="12" stroke="white" stroke-width="1.3" opacity="0.75" stroke-linecap="round"/>
  <line x1="52" y1="7"  x2="52" y2="17" stroke="white" stroke-width="1.3" opacity="0.75" stroke-linecap="round"/>

  <!-- ── Propeller blades — rear (dimmer) ── -->
  <line x1="7"  y1="52" x2="17" y2="52" stroke="white" stroke-width="1.0" opacity="0.45" stroke-linecap="round"/>
  <line x1="12" y1="47" x2="12" y2="57" stroke="white" stroke-width="1.0" opacity="0.45" stroke-linecap="round"/>
  <line x1="47" y1="52" x2="57" y2="52" stroke="white" stroke-width="1.0" opacity="0.45" stroke-linecap="round"/>
  <line x1="52" y1="47" x2="52" y2="57" stroke="white" stroke-width="1.0" opacity="0.45" stroke-linecap="round"/>

  <!-- ── Central body ── -->
  <circle cx="32" cy="32" r="6" fill="white" opacity="0.96"/>
  <circle cx="32" cy="32" r="3.5" fill="#00C8C8" opacity="0.85"/>

  <!-- ── Forward direction indicator (teal dot toward top = nose) ── -->
  <circle cx="32" cy="21" r="2.8" fill="#00C8C8" opacity="0.95"/>
  <line x1="32" y1="26" x2="32" y2="32" stroke="#00C8C8" stroke-width="1.5" opacity="0.7"/>

</svg>
